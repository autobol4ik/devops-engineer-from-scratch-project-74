services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hexlet-8-dev:local
    command: make dev
    environment:
      NODE_ENV: production
    volumes:
      - ./app:/app
    ports:
      - "8080:8080"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
